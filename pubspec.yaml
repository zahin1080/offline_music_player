name: minimal_music_player
description: "A new Flutter Music App project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  permission_handler: ^11.3.1
  on_audio_query: ^2.9.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19


dependency_overrides:
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/music.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "images/music.png"


flutter_native_splash:
  color: "#0F172A"
  image: "images/music.png"
  android_12:
    image: "images/music.png"
    icon_background_color: "#0F172A"

flutter:
  uses-material-design: true

  assets:
    - images/
